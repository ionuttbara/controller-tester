[package]
name = "ibbe-controller-manager"
version = "0.5.2"
edition = "2021"

[[bin]]
name = "IBBE-ControllerManager"
path = "src/main.rs"

[dependencies]
slint = "1.17.1"
gilrs = "0.11.2"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
parking_lot = "0.12"
crossbeam-channel = "0.5"
crc32fast = "1.4"

[target.'cfg(windows)'.dependencies]
hidapi = { version = "2.6.7", default-features = false, features = ["windows-native"] }
hidreport = "0.6.0"
winreg = "0.56"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_XboxController",
] }

[build-dependencies]
slint-build = "1.17.1"
winres = "0.1"

[profile.release]
codegen-units = 1
incremental = false
lto = "thin"
strip = "symbols"
panic = "abort"
